// Module app : la coquille Android — interface (assistant d'installation, projets,
// builds) et service hôte en premier plan. Aucune logique de build : tout le travail
// de construction vit dans le moteur téléchargé (module engine), exécuté dans un
// processus séparé.

plugins {
    id 'com.android.application'
}

android {
    namespace 'jo.forge.app'
    compileSdk 34

    defaultConfig {
        applicationId 'jo.forge.app'
        minSdk 28
        // targetSdk 28 assumé : préserve l'exécution des binaires d'outils téléchargés
        // depuis le stockage privé (politique W^X d'Android 10+, voir docs/conception.md D-04).
        targetSdk 28
        versionCode 14
        versionName '0.2.12'
    }

    signingConfigs {
        // Clé d'essai STABLE : posée par la CI depuis le jeton FORGE_APK_KEYSTORE_B64
        // (fichier décodé pointé par FORGE_APK_KEYSTORE, mot de passe FORGE_APK_KEYSTORE_MDP).
        // Sans ces variables (développement local), la clé de débogage par défaut
        // s'applique — mais chaque APK de CI doit pouvoir s'installer sur le précédent.
        test {
            def chemin = System.getenv('FORGE_APK_KEYSTORE')
            def motDePasse = System.getenv('FORGE_APK_KEYSTORE_MDP')
            if (chemin) {
                storeFile file(chemin)
                storePassword motDePasse
                keyAlias 'forge-test'
                keyPassword motDePasse
            }
        }
    }

    buildTypes {
        debug {
            // Signature d'essai stable quand la CI la fournit (sinon clé de débogage).
            if (System.getenv('FORGE_APK_KEYSTORE')) {
                signingConfig signingConfigs.test
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':api')
    implementation project(':client')
    implementation project(':setup')

    // Test de bout en bout du chargement : le vrai moteur (module engine) est installé
    // par le module setup puis lancé dans un vrai processus séparé.
    testImplementation project(':engine')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Tests unitaires JVM de la coquille : classes sans dépendance Android uniquement.
android {
    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
    }
}

// ---------------------------------------------------------------------------
// Exemples embarqués : les projets d'exemple sont zippés en assets de la coquille
// pour un premier build immédiat sur appareil — aucun accès au stockage partagé,
// aucune permission : les projets atterrissent dans le stockage privé de l'app.
// ---------------------------------------------------------------------------

def exemplesAssets = layout.buildDirectory.dir('generated/exemplesAssets').get().asFile

android {
    sourceSets {
        main {
            assets.srcDirs += exemplesAssets
        }
    }
}

def tachesExemples = ['multi-modules-java', 'application-android', 'kotlin-simple', 'application-kotlin'].collect { exemple ->
    tasks.register("zipExemple-${exemple}", Zip) {
        group = 'construction'
        description = "Embarque examples/${exemple} en asset de la coquille."
        archiveFileName = "${exemple}.zip"
        destinationDirectory = new File(exemplesAssets, 'exemples')
        from(rootProject.file("examples/${exemple}"))
    }
}

tasks.named('preBuild') {
    dependsOn tachesExemples
}
