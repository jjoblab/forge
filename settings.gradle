// Réglages du build multi-modules de Forge.
// Modules : api (contrat), json (lecture/écriture JSON), client (supervision du moteur),
// setup (installateur), engine (moteur de build), app (coquille Android).

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
        google()
    }
}

rootProject.name = 'forge'

include ':api'
include ':json'
include ':client'
include ':setup'
include ':engine'
include ':app'
