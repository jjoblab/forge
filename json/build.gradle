// Module json : lecture et écriture JSON minimales, sans dépendance — partagé par
// l'installateur (manifeste signé, état installé) et le moteur (forge.json, trace de
// build). Analyse stricte : ce parseur sert à des fichiers de confiance ou vérifiés,
// pas à du JSON arbitraire.

plugins {
    id 'java-library'
    // Publication Maven (demande F-01 de JoIDE) : le module se publie tel quel sur
    // mavenLocal — les IDE consomment Forge comme bibliothèque versionnée
    // (./gradlew publishToMavenLocal) sans script d'injection externe.
    id 'maven-publish'
}

group = 'jo.forge'
version = forgeVersion // source unique : gradle.properties (constat B-7)

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
