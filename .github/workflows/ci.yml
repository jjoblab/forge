# CI de Forge : contrôle des termes interdits, puis build et tests de tous les modules.
# - hygiene : contrôle anti-référence (secret FORBIDDEN_TERMS) + garde de structure.
# - build   : JDK 17 + SDK Android (plateforme 34, build-tools 34), tests JVM des modules
#             purs (api, client, setup, engine) et assemblage de la coquille (app).
name: CI

on:
  push:
    branches: [main]
    # Les étiquettes de version déclenchent la chaîne de publication (job release) :
    # sans filtre tags, un push d'étiquette n'exécute AUCUN job du workflow.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiène du dépôt (termes interdits, structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # l'historique complet est requis pour contrôler les messages de commit

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Contrôle des termes interdits
        env:
          # Secret optionnel (une expression par ligne) ; sans secret, le contrôle est ignoré.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: ./tools/check-references.sh

      - name: Structure du dépôt
        run: |
          test -f README.md
          test -f docs/REFERENCES.md
          test -f docs/analyse-moteur-build.md
          test -f docs/revue-moteur-build.md
          test -f docs/conception.md
          test -f docs/distribution.md
          test -f docs/limites-et-suite.md
          test -x tools/check-references.sh
          test -x tools/hooks/pre-commit
          test -x tools/hooks/commit-msg
          test -x ./gradlew

  build:
    name: Build et tests (JDK 17)
    runs-on: ubuntu-latest
    env:
      # Le SDK Android est préinstallé sur les exécutants GitHub (ubuntu-latest) :
      # pas besoin d'action tierce, qui casse sur l'acceptation des licences.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les composants SDK requis
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # Licences déjà acceptées sur l'image ; on tolère un code de retour non nul
          # du pipage « yes » avec les cmdline-tools récents.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Tests JVM (api, json, client, setup, engine)
        run: ./gradlew --no-daemon :api:test :json:test :client:test :setup:test :engine:test --stacktrace

      - name: Tests de la coquille (chargement du moteur installé)
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Décoder la clé d'essai de signature APK
        # Clé STABLE : les APK de test successifs s'installent l'un sur l'autre
        # (la clé de débogage d'un exécutant éphémère changerait à chaque build).
        env:
          FORGE_APK_KEYSTORE_B64: ${{ secrets.FORGE_APK_KEYSTORE_B64 }}
          FORGE_APK_KEYSTORE_MDP: ${{ secrets.FORGE_APK_KEYSTORE_MDP }}
        run: |
          echo "$FORGE_APK_KEYSTORE_B64" | base64 -d > /tmp/forge-test.jks
          echo "FORGE_APK_KEYSTORE=/tmp/forge-test.jks" >> "$GITHUB_ENV"
          echo "FORGE_APK_KEYSTORE_MDP=$FORGE_APK_KEYSTORE_MDP" >> "$GITHUB_ENV"

      - name: Assemblage de la coquille (app)
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Publier l'APK de débogage en artefact
        uses: actions/upload-artifact@v4
        with:
          name: forge-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Publication (composants et manifeste signé)
    # Se déclenche sur les étiquettes de version (vX.Y.Z) : la chaîne complète
    # (tests -> composants dexés -> manifeste signé -> vérification contre la clé
    # publique épinglée -> version GitHub) ne s'exécute qu'à la publication.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les composants SDK requis
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Télécharger le prébuilt aapt2 (arm64-v8a)
        # Source : ReVanced/aapt2 (construction AOSP ciblée Android, Apache-2.0).
        # Les segments LOAD sont alignés 16 Ko : le binaire se charge sur les
        # appareils à pages de 4 Ko ET de 16 Ko (un binaire aligné 4 Ko — comme
        # les prébuilts lzhiyong plus anciens — est tué par SIGSEGV dès exec sur
        # un appareil 16 Ko). Les prébuilts des build-tools Google sont
        # x86_64/Linux : inutilisables sur appareil.
        run: |
          curl -fL --retry 3 -o /tmp/aapt2-arm64-v8a \
            "https://github.com/ReVanced/aapt2/releases/download/v1.1.0/aapt2-arm64-v8a"
          # Garde contre une page d'erreur HTML posée en binaire : magie ELF + taille.
          test "$(head -c4 /tmp/aapt2-arm64-v8a | od -An -tx1 | tr -d ' \n')" = "7f454c46"
          test "$(stat -c%s /tmp/aapt2-arm64-v8a)" -gt 100000

      - name: Assembler les composants et signer le manifeste
        env:
          # Clé privée de signature (PKCS#8, base64) : JETON CI, jamais versionnée.
          FORGE_MANIFEST_KEY: ${{ secrets.FORGE_MANIFEST_KEY }}
          # Le composant platform-34 (android.jar) est publié depuis v0.2.7 :
          # sans lui, aucune compilation ne résout java.lang.Object sur ART
          # (ECJ ne peut pas lire la plate-forme dex/oat de l'appareil).
          # Le composant aapt2-arm64-v8a (prébuilt ReVanced téléchargé ci-dessus)
          # est publié depuis v0.2.8 : sans lui, tout module application Android
          # échoue avant la première tâche (localisateur d'outils).
          FORGE_AAPT2: /tmp/aapt2-arm64-v8a
        run: |
          echo "$FORGE_MANIFEST_KEY" > /tmp/cle-privee.b64
          FORGE_CLE_PRIVEE=/tmp/cle-privee.b64 ./gradlew --no-daemon :engine:composants
          rm -f /tmp/cle-privee.b64

      - name: Vérifier le manifeste contre la clé publique épinglée
        run: |
          # La signature publiée doit être valide pour la clé PUBLIQUE épinglée dans
          # la coquille (ClesForge) : prouve que le jeton CI et la coquille parlent
          # de la même paire de clés.
          python3 - <<'PY'
          import re
          source = open('app/src/main/java/jo/forge/app/ClesForge.java').read()
          morceaux = re.findall(r'"([^"]+)"', source.split('CLÉ_PUBLIQUE_MANIFESTE')[1])
          open('/tmp/cle-publique.b64', 'w').write(''.join(morceaux))
          PY
          ./gradlew --no-daemon :setup:jar :json:jar :api:jar -q
          java -cp "setup/build/libs/setup-0.2.8.jar:json/build/libs/json-0.2.8.jar:api/build/libs/api-0.2.8.jar" \
            jo.forge.setup.manifest.OutilManifeste verifier \
            engine/build/composants/manifest.json /tmp/cle-publique.b64 \
            engine/build/composants/manifest.sig

      - name: Décoder la clé d'essai de signature APK
        env:
          FORGE_APK_KEYSTORE_B64: ${{ secrets.FORGE_APK_KEYSTORE_B64 }}
          FORGE_APK_KEYSTORE_MDP: ${{ secrets.FORGE_APK_KEYSTORE_MDP }}
        run: |
          echo "$FORGE_APK_KEYSTORE_B64" | base64 -d > /tmp/forge-test.jks
          echo "FORGE_APK_KEYSTORE=/tmp/forge-test.jks" >> "$GITHUB_ENV"
          echo "FORGE_APK_KEYSTORE_MDP=$FORGE_APK_KEYSTORE_MDP" >> "$GITHUB_ENV"

      - name: Assembler la coquille (APK installable de test)
        # APK signé avec la clé d'essai STABLE du dépôt : installable par chargement
        # latéral et upgradable par-dessus les versions de test précédentes. La
        # signature de production reste une évolution consignée (limites-et-suite.md).
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Publier la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            engine/build/composants/*.zip \
            engine/build/composants/manifest.json \
            engine/build/composants/manifest.sig \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Forge $GITHUB_REF_NAME" \
            --notes "Composants du moteur (dexés pour ART ; platform-34 embarque android.jar, aapt2-arm64-v8a embarque le prébuilt Android de ReVanced/aapt2), manifeste signé (ECDSA P-256) et coquille (APK de débogage, installable). Vérifiez le manifeste avec la clé publique épinglée dans la coquille (ClesForge) avant toute installation."
