// Module setup : installation du moteur — manifeste signé, téléchargement reprenable,
// vérification d'intégrité et d'authenticité, installation atomique, mise à jour,
// réparation, désinstallation, planification et assistant. Pur Java, testable sur JVM.

plugins {
    id 'java-library'
}

group = 'jo.forge'
version = '0.2.4'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    api project(':json')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
