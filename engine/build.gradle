// Module engine : le moteur de build lui-même — bootstrap de la VM, modèle de projet,
// graphe de tâches, exécuteur borné, empreintes et magasin d'état, pipelines de
// compilation (Java, Android) et résolution de dépendances. Pur Java, testé sur JVM,
// exécuté sur ART via app_process. Ne dépend d'aucune API Android.

plugins {
    id 'java-library'
}

group = 'jo.forge'
version = '0.2.9'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

configurations {
    // Compilateur Kotlin embarqué (feuille de route langages, v0.2.9) : le moteur
    // n'y touche que PAR RÉFLEXION (aucune dépendance de compilation) ; cette
    // configuration résout le compilateur ET ses dépendances runtime (stdlib,
    // reflect, script-runtime, coroutines, trove4j, daemon — le POM de
    // l'embarquable les déclare, et le compilateur MEURT sans elles :
    // NoClassDefFoundError kotlinx/coroutines/CoroutineScope constaté) — c'est
    // cet ENSEMBLE qui rejoint le composant kotlin-compiler (tâche « composants »,
    // --kotlin) ; les tests le récupèrent en testImplementation.
    kotlinCompiler
}

dependencies {
    api project(':api')
    api project(':json')

    // Compilateur Java embarqué (pur Java, EPL-2.0 — voir docs/distribution.md §7).
    implementation 'org.eclipse.jdt:ecj:3.36.0'

    // Dexeur (d8) et signature d'APK (Apache-2.0 — voir docs/distribution.md §7).
    implementation 'com.android.tools:r8:8.5.35'
    implementation 'com.android.tools.build:apksig:8.5.2'

    // Compilateur Kotlin (Apache-2.0) : ~56 Mo + ~6 Mo de dépendances runtime du
    // POM, en réflexion uniquement. La bibliothèque standard fait partie de
    // l'ensemble résolu (le compilateur ne la porte PAS lui-même) : elle est dexée
    // DANS le composant (exécution du moteur sur appareil) et rejoint le classpath
    // des TESTS (exécution du résultat compilé). Pour la COMPILATION d'un module,
    // elle vient du classpath du moteur (JVM de test) ou d'une dépendance Maven du
    // module (appareil — voir examples/kotlin-simple/forge.json).
    kotlinCompiler 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21'
    testImplementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.0.21'
    testImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'

    // aapt2 : sur appareil, le binaire vient du composant installé (par ABI).
    // Depuis v0.2.8, FORGE_AAPT2 pointe le prébuilt Android de ReVanced/aapt2
    // (alignement 16 Ko) téléchargé par la CI — le binaire x86_64 des build-tools
    // local n'est qu'un repli de développement (inutilisable sur appareil).
    // FORGE_SANS_AAPT2 reste la porte de sortie explicite (juridique ou réseau).
    testImplementation 'com.android.tools.build:aapt2:8.5.2-11315950:linux'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Le dexeur (d8) tourne EN PROCESSUS dans certains tests : lui laisser la place.
    maxHeapSize = '2g'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Tranches lambda (correctif v0.2.7) : android.jar omet java.lang.invoke.
// StringConcatFactory et LambdaMetafactory, qu'un compilateur Java 9+ doit
// résoudre pour abaisser concaténations et lambdas en invokedynamic. Les
// tranches (signatures seules, jamais exécutées) sont compilées par ECJ
// --release 8 — la plate-forme Java 8 porte MethodHandles mais PAS ces
// fabriques : aucune collision de définition, aucun android.jar requis —
// puis embarquées comme entrée /lambda-stubs.jar du jar du moteur. Entrée
// non-classe : elle survit au dexage (v0.2.4) et le classloader d'ART la
// sert sur l'appareil ; jamais dexée (java.* interdit dans un dex).
// ---------------------------------------------------------------------------

def tranchesSources = files(
        fileTree('src/stubsLambda/java') { include '**/*.java' })
def tranchesClasses = layout.buildDirectory.dir('tranchesLambda/classes')
def tranchesRessource = layout.buildDirectory.dir('tranchesLambda/ressource')

tasks.register('compilerTranchesLambda', JavaExec) {
    group = 'build'
    description = 'Compile les tranches lambda java.lang.invoke (ECJ --release 8).'
    inputs.files(tranchesSources)
    outputs.dir(tranchesClasses)
    def jarEcj = configurations.runtimeClasspath.find { it.name.startsWith('ecj-') }
    classpath = files(jarEcj)
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    args(['--release', '8', '-nowarn', '-encoding', 'UTF-8',
          '-d', tranchesClasses.get().asFile.absolutePath]
            + tranchesSources.collect { it.absolutePath })
}

tasks.register('tranchesLambdaJar', Zip) {
    group = 'build'
    description = 'Assemble /lambda-stubs.jar (ressource embarquée du jar du moteur).'
    dependsOn 'compilerTranchesLambda'
    archiveFileName = 'lambda-stubs.jar'
    destinationDirectory = tranchesRessource
    from(tranchesClasses)
    // Jar déterministe : horodatage normalisé (reproductibilité des composants).
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// La ressource rejoint le jar du moteur (et le classpath des tests).
sourceSets.main.resources.srcDir tranchesRessource
tasks.named('processResources') { dependsOn 'tranchesLambdaJar' }

// ---------------------------------------------------------------------------
// Publication (étape 12) : assemblage des composants du moteur et du manifeste.
// ---------------------------------------------------------------------------

def versionComposants = '0.2.9'

tasks.register('composants', JavaExec) {
    group = 'publication'
    description = 'Assemble les composants dexés du moteur et le manifeste (signé si FORGE_CLE_PRIVEE pointe la clé privée).'
    dependsOn ':api:jar', ':json:jar', ':client:jar', ':engine:jar'

    def cheminAndroidJar = {
        def force = System.getenv('FORGE_ANDROID_JAR')
        if (force) return force
        def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (sdk) {
            def candidat = new File(sdk, 'platforms/android-34/android.jar')
            if (candidat.isFile()) return candidat.absolutePath
        }
        return null
    }()
    def cheminAapt2 = {
        def force = System.getenv('FORGE_AAPT2')
        if (force) return force
        def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (sdk) {
            def outils = new File(sdk, 'build-tools/34.0.0/aapt2')
            if (outils.isFile()) return outils.absolutePath
        }
        return null
    }()

    def r8Jar = configurations.runtimeClasspath.find { it.name.startsWith('r8-') }
    def ecjJar = configurations.runtimeClasspath.find { it.name.startsWith('ecj-') }
    def apksigJar = configurations.runtimeClasspath.find { it.name.startsWith('apksig-') }
    // NOTE : la configuration kotlinCompiler (compilateur + dépendances runtime de
    // son POM, ~62 Mo) est résolue À L'EXÉCUTION de la tâche (doFirst ci-dessous),
    // JAMAIS à la configuration — une résolution impatiente téléchargeait ces jars
    // pour CHAQUE invocation Gradle (test, coquille, APK…) et un échec réseau à ce
    // moment cassait TOUT build ; ici, seuls les --composants le paient.

    classpath = project(':setup').sourceSets.main.runtimeClasspath
    mainClass = 'jo.forge.setup.packaging.PackagerComposants'

    def arguments = ['--sortie', layout.buildDirectory.dir('composants').get().asFile.absolutePath,
                     '--version', versionComposants,
                     '--d8', r8Jar?.absolutePath,
                     '--moteur',
                     project(':api').tasks.jar.archiveFile.get().asFile.absolutePath,
                     project(':json').tasks.jar.archiveFile.get().asFile.absolutePath,
                     project(':client').tasks.jar.archiveFile.get().asFile.absolutePath,
                     project(':engine').tasks.jar.archiveFile.get().asFile.absolutePath,
                     '--compilateur', ecjJar?.absolutePath,
                     '--compat-art',
                     project(':setup').file('src/compatArt/java').absolutePath,
                     '--dexeur', r8Jar?.absolutePath,
                     '--signeur', apksigJar?.absolutePath]
    // Composant aapt2-<abi> : publié depuis v0.2.8 (prébuilt Android de
    // ReVanced/aapt2, voir ci-dessus). FORGE_SANS_AAPT2 omet explicitement le
    // composant (garde juridique docs/distribution.md §7) ; sans FORGE_AAPT2,
    // le repli est le binaire x86_64 des build-tools locaux — utile aux tests
    // JVM seulement, jamais distribuable pour un appareil.
    def sansAapt2 = System.getenv('FORGE_SANS_AAPT2')
    if (cheminAndroidJar) {
        arguments.addAll(['--android-jar', cheminAndroidJar])
    }
    if (cheminAapt2 && !sansAapt2) {
        arguments.addAll(['--aapt2', cheminAapt2, '--abi', 'arm64-v8a'])
    }
    def cléPrivée = System.getenv('FORGE_CLE_PRIVEE')
    if (cléPrivée) {
        arguments.addAll(['--clé-privée', cléPrivée])
    }
    // Économie de données (v0.2.9) : versions d'outils dérivées du contenu et URL
    // de la release pérenne « outils » — la CI les fournit pour la publication ;
    // sans elles, comportement historique (URL de la version du moteur).
    def urlOutils = System.getenv('FORGE_URL_OUTILS')
    if (urlOutils) {
        arguments.addAll(['--url-outils', urlOutils])
    }
    def versionAapt2 = System.getenv('FORGE_VERSION_AAPT2')
    if (versionAapt2) {
        arguments.addAll(['--version-aapt2', versionAapt2])
    }
    args = arguments.findAll { it != null }
    // L'ENSEMBLE Kotlin (compilateur + dépendances runtime de son POM) est résolu
    // ICI, à l'exécution : trié par nom pour un assemblage déterministe —
    // l'embarquable seul meurt à l'exécution (NoClassDefFoundError coroutines,
    // constaté) et la stdlib doit vivre dans le même composant dexé.
    doFirst {
        def jarsKotlin = configurations.kotlinCompiler.files
                .findAll { it.isFile() }.sort { a, b -> a.name <=> b.name }
        if (jarsKotlin.isEmpty()) {
            throw new GradleException("configuration kotlinCompiler vide — "
                    + "org.jetbrains.kotlin:kotlin-compiler-embeddable inrésolvable")
        }
        args('--kotlin')
        jarsKotlin.each { jar -> args(jar.absolutePath) }
    }
}
