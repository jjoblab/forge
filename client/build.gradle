// Module client : supervision du moteur installé — lancement de la VM enfant
// (app_process sur appareil, java en développement), poignée de main, corrélation
// requêtes/événements, reconnexion. Pur Java, testable sur JVM.

plugins {
    id 'java-library'
}

group = 'jo.forge'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    api project(':api')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
