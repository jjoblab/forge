# Paramètres du build Gradle de Forge.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Pas d'AndroidX : la coquille n'utilise que les API du cadre (cible légère, sans dépendances).
android.useAndroidX=false
android.enableJetifier=false

# SOURCE UNIQUE DE LA VERSION (constat B-7) : tous les build.gradle (version des
# modules, versionName de la coquille, version des composants publiés) la lisent
# ici ; le test CohérenceVersionTest fait rougir le build si EngineVersion.CURRENT
# n'est pas bumpée en même temps. L'incident v0.2.11 (constante oubliée) est mort.
forgeVersion=0.2.25
forgeVersionCode=27
